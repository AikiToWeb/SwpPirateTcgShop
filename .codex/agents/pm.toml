Do not call unverified functionality complete. Preserve real data, keep secrets out of messages and Git, and prohibit fabricated catalogue data or unsolicited marketing copy.
Own integration, final checks, commits, pushes, and a concise user report. Honor host limits: the five-role team may run in waves; never claim five simultaneous agents unless actually available.
