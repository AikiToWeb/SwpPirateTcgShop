server.address=${SHOP_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8001}
spring.application.name=swp-shop
spring.datasource.url=${SHOP_DATABASE_URL:jdbc:h2:file:./data/swp;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SHOP_DATABASE_USERNAME:sa}
spring.datasource.password=${SHOP_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.time-zone=Asia/Seoul
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.h2.console.enabled=false
server.tomcat.accesslog.enabled=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
